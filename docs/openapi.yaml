      properties:
        taskId: { type: string }
        title: { type: string }
        columnId: { type: string }
        columnName: { type: string }
        completed: { type: boolean }
    TaskDependencySummary:
      type: object
      required: [blockedBy, blocking]
      properties:
        blockedBy:
          type: array
          items: { $ref: '#/components/schemas/TaskDependencyRef' }
        blocking:
          type: array
          items: { $ref: '#/components/schemas/TaskDependencyRef' }
    MyTask:
      allOf:
        - $ref: '#/components/schemas/TaskCard'
