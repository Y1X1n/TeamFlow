          required: [project]
          properties:
            project:
              type: object
              required: [id, name, color]
              properties:
                id: { type: string }
                name: { type: string }
                color: { type: string }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description:
          type: object
          description: ProseMirror JSON（≤100KB）
          additionalProperties: true
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assigneeId: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date-time }
        estimateMinutes:
          type: [integer, 'null']
          minimum: 15
          maximum: 10080
          multipleOf: 15
        actualMinutes:
          type: [integer, 'null']
          minimum: 15
          maximum: 10080
          multipleOf: 15
        labels:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 20 }
        columnId: { type: string, description: 缺省为第一列 }
    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description:
          type: [object, 'null']
          additionalProperties: true
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assigneeId: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date-time }
        estimateMinutes:
          type: [integer, 'null']
          minimum: 15
          maximum: 10080
          multipleOf: 15
        actualMinutes:
          type: [integer, 'null']
          minimum: 15
          maximum: 10080
          multipleOf: 15
        labels:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 20 }
    MoveTaskRequest:
      type: object
      required: [columnId]
      properties:
        columnId: { type: string }
