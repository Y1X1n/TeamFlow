        blockedByTaskId: { type: string, description: 必须先完成的同项目任务 ID }

    Board:
      type: object
      required: [project, columns, tasks, members, myPermissions]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumn' }
        tasks:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/TaskCard' }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberSummary' }
        myPermissions:
          type: array
