            - MEMBER_JOINED
            - MEMBER_REMOVED
            - MEMBER_ROLE_CHANGED
            - MEMBER_PERMISSIONS_CHANGED
            - COLUMN_CREATED
            - COLUMN_UPDATED
            - COLUMN_DELETED
            - TASK_CREATED
            - TASK_UPDATED
            - TASK_MOVED
            - TASK_COMPLETED
            - TASK_REOPENED
            - TASK_ASSIGNED
            - TASK_DELETED
            - TASK_RESTORED
            - COMMENT_CREATED
            - COMMENT_UPDATED
            - COMMENT_DELETED
            - ATTACHMENT_ADDED
            - ATTACHMENT_DELETED
            - REPORT_GENERATED
            - MEMBER_SKILLS_CHANGED
