          required:
            [description, createdBy, subtasks, watching, watcherCount, blockedBy, blocking]
          properties:
            description:
              type: [object, 'null']
              description: ProseMirror JSON 文档
              additionalProperties: true
            createdBy:
              type: object
              required: [userId, name]
              properties:
                userId: { type: string }
                name: { type: string }
            subtasks:
              type: array
              items: { $ref: '#/components/schemas/Subtask' }
            watching: { type: boolean }
            watcherCount: { type: integer }
            blockedBy:
              type: array
              items: { $ref: '#/components/schemas/TaskDependencyRef' }
            blocking:
              type: array
              items: { $ref: '#/components/schemas/TaskDependencyRef' }
    TaskDependencyRef:
      type: object
