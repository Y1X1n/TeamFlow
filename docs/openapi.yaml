        suggestedAssigneeId: { type: [string, 'null'] }
        suggestedAssigneeName: { type: [string, 'null'] }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        dueInDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 30
        dependsOn:
          type: array
          items: { type: integer, minimum: 0 }

    AiPlan:
      type: object
      required: [steps, source, model, notice]
      properties:
        steps:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/AiPlanStep' }
        source: { type: string, enum: [ai, local] }
        model: { type: [string, 'null'] }
        notice: { type: [string, 'null'] }

    NotificationType:
      type: string
      enum:
        - TASK_ASSIGNED
        - TASK_COMMENTED
        - TASK_UPDATED
        - COMMENT_REPLY
        - COMMENT_REACTION
        - MENTION
        - TASK_DUE_SOON
        - TASK_OVERDUE
        - MEMBER_JOINED
        - MEMBER_REMOVED
        - ROLE_CHANGED
        - WEEKLY_REPORT
        - INVITE
    Notification:
      type: object
      required: [id, type, payload, read, createdAt]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/NotificationType' }
        payload:
          type: object
          additionalProperties: true
        read: { type: boolean }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unreadCount, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unreadCount: { type: integer, minimum: 0 }
        nextCursor: { type: [string, 'null'] }

    Subtask:
      type: object
      required: [id, taskId, title, isDone, position, createdAt, updatedAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        title: { type: string, maxLength: 120 }
        isDone: { type: boolean }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubtaskList:
      type: object
      required: [items, progress]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Subtask' }
        progress:
          type: object
          required: [total, done]
          properties:
            total: { type: integer }
            done: { type: integer }
    CreateSubtaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
    UpdateSubtaskRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        isDone: { type: boolean }
    WatchState:
      type: object
      required: [watching, watcherCount]
      properties:
        watching: { type: boolean }
        watcherCount: { type: integer, minimum: 0 }
    ReactionEmoji:
      type: string
      enum: ['👍', '❤️', '😄', '🎉', '👀']
    ReactionRequest:
      type: object
      required: [emoji]
      properties:
        emoji: { $ref: '#/components/schemas/ReactionEmoji' }
    ReactionSummary:
      type: object
      required: [emoji, count, reactedByMe, userNames]
      properties:
        emoji: { type: string }
        count: { type: integer }
        reactedByMe: { type: boolean }
        userNames:
          type: array
          items: { type: string }
    ReactionState:
      type: object
      required: [reactions]
      properties:
        reactions:
          type: array
          items: { $ref: '#/components/schemas/ReactionSummary' }
    NotificationPreferences:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: object
          additionalProperties: { type: boolean }
          description: 13 种通知类型的开关
    UpdateNotificationPreferencesRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: object
          additionalProperties: { type: boolean }
    SearchResults:
      type: object
      required: [projects, tasks, members]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [id, name, color, archived]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: [string, 'null'] }
              color: { type: string }
              archived: { type: boolean }
        tasks:
          type: array
          items:
            type: object
            required:
              [id, title, projectId, projectName, projectColor, columnId,
               columnName, priority]
            properties:
              id: { type: string }
              title: { type: string }
              projectId: { type: string }
              projectName: { type: string }
              projectColor: { type: string }
              columnId: { type: string }
              columnName: { type: string }
              priority: { $ref: '#/components/schemas/TaskPriority' }
              dueDate: { type: [string, 'null'], format: date-time }
              completedAt: { type: [string, 'null'], format: date-time }
        members:
          type: array
          items:
            type: object
            required: [userId, name, email, projects]
            properties:
              userId: { type: string }
              name: { type: string }
              email: { type: string, format: email }
              avatarUrl: { type: [string, 'null'] }
              projects:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
    AiStatus:
      type: object
      required: [enabled, provider, model, fallback]
      properties:
        enabled: { type: boolean }
        provider: { type: string }
        model: { type: [string, 'null'] }
        fallback: { type: string, const: local }
        costNotice: { type: [string, 'null'] }
    AiBreakdown:
      type: object
      required: [subtasks, source]
      properties:
        subtasks:
          type: array
          maxItems: 6
          items: { type: string }
        source: { type: string, enum: [ai, local] }
        model: { type: string }
        notice: { type: string }
