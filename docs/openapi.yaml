          type: [string, 'null']
          description: 目标列中的参考任务；null=列尾
        force:
          type: boolean
          description: 仅用于移入完成列时忽略未完成依赖；缺省 false 并返回 409 TASK_BLOCKED
    CreateTaskDependencyRequest:
      type: object
      required: [blockedByTaskId]
