      type: object
      properties:
        beforeColumnId:
          type: [string, 'null']
          description: 移动到该列之前；null 表示最右侧

    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    TaskCard:
      type: object
      required:
        [id, projectId, columnId, title, priority, labels, position, commentCount,
         attachmentCount, subtaskTotal, subtaskDone, blockedByCount, blockingCount,
         estimateMinutes, actualMinutes, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        columnId: { type: string }
        title: { type: string }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assignee:
          anyOf:
            - $ref: '#/components/schemas/MemberSummary'
            - { type: 'null' }
        dueDate: { type: [string, 'null'], format: date-time }
        estimateMinutes:
          type: [integer, 'null']
          minimum: 15
          maximum: 10080
          multipleOf: 15
          description: 预计工时（分钟，15 分钟粒度）
        actualMinutes:
          type: [integer, 'null']
          minimum: 15
          maximum: 10080
          multipleOf: 15
          description: 实际工时（分钟，15 分钟粒度）
        labels:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 20 }
        position: { type: string }
        completedAt: { type: [string, 'null'], format: date-time }
        commentCount: { type: integer }
        attachmentCount: { type: integer }
        subtaskTotal: { type: integer }
        subtaskDone: { type: integer }
        blockedByCount:
          type: integer
          description: 未完成阻塞依赖数量；>0 时不能直接标记完成
        blockingCount:
          type: integer
          description: 当前被本任务阻塞且未完成的下游任务数量
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TrashTask:
      type: object
      required:
        [id, projectId, title, columnId, columnName, priority, assignee, dueDate,
         estimateMinutes, actualMinutes, labels, deletedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        title: { type: string }
        columnId: { type: string }
        columnName: { type: string }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assignee:
          anyOf:
            - type: object
              required: [userId, name, avatarUrl]
              properties:
                userId: { type: string }
                name: { type: string }
                avatarUrl: { type: [string, 'null'] }
            - { type: 'null' }
        dueDate: { type: [string, 'null'], format: date-time }
        estimateMinutes: { type: [integer, 'null'], minimum: 15, maximum: 10080, multipleOf: 15 }
        actualMinutes: { type: [integer, 'null'], minimum: 15, maximum: 10080, multipleOf: 15 }
        labels:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 20 }
        deletedAt: { type: string, format: date-time }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskCard'
